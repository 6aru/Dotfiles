#  ═══════════════════════════════════════════════════════════════
#   ULTIMATE KITTY CONFIG
#   Place at: ~/.config/kitty/kitty.conf
#  ═══════════════════════════════════════════════════════════════

# ─── Font ───────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 10

# Disables kitty's automatic font-size adjustments per-glyph;
# keeps nerd font icons aligned to the cell grid.
disable_ligatures never
font_features JetBrainsMonoNL-Regular +zero +ss01 +ss02 +ss03 +ss04 +ss05

adjust_line_height  105%
adjust_column_width 0
box_drawing_scale 0.001, 1, 1.5, 2

# ─── Cursor ─────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ─── Scrollback ─────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0

# ─── Mouse ──────────────────────────────────────────────────────
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
copy_on_select yes
strip_trailing_spaces smart

# ─── Performance ────────────────────────────────────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ─── Window layout ──────────────────────────────────────────────
remember_window_size  no
initial_window_width  1000
initial_window_height 650

window_padding_width 12
window_margin_width   0
hide_window_decorations titlebar-only

placement_strategy center

confirm_os_window_close 0

# ─── Tab bar ────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ─── Layouts ────────────────────────────────────────────────────
enabled_layouts splits,stack,tall,fat,grid
window_resize_step_cells 2
window_resize_step_lines 2

# ─── Bell ───────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.15
window_alert_on_bell yes
bell_on_tab yes

# ─── Advanced ───────────────────────────────────────────────────
shell .
editor nvim
close_on_child_death no
allow_remote_control yes
listen_on unix:/tmp/kitty
update_check_interval 0
clipboard_control write-clipboard write-primary read-clipboard read-primary
allow_hyperlinks yes
shell_integration enabled

# ─── Theme: Catppuccin Mocha (swap for pywal below if desired) ──
include Gruvbox Dark.conf
background_opacity 0.95
dynamic_background_opacity no

# ─── Pywal integration (optional) ───────────────────────────────
# Comment out the Catppuccin block above and uncomment this line
# to have kitty follow your wallpaper-generated palette instead:
# include ~/.cache/wal/colors-kitty.conf

# ─── Keybindings ────────────────────────────────────────────────
kitty_mod ctrl+shift

map kitty_mod+enter      new_window
map kitty_mod+t          new_tab
map kitty_mod+w          close_window
map kitty_mod+right      next_tab
map kitty_mod+left       previous_tab
map kitty_mod+equal      increase_font_size
map kitty_mod+minus      decrease_font_size
map kitty_mod+backspace  restore_font_size

map kitty_mod+f          launch --location=hsplit
map kitty_mod+v          launch --location=vsplit
map kitty_mod+z          toggle_layout stack

map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+k neighboring_window up
map kitty_mod+j neighboring_window down

map kitty_mod+c copy_to_clipboard
map kitty_mod+p paste_from_clipboard

map kitty_mod+up   scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end  scroll_end

map kitty_mod+f5 load_config_file
map kitty_mod+f11 toggle_fullscreen

# ─── OS-specific tweaks ─────────────────────────────────────────
linux_display_server auto
wayland_titlebar_color background
macos_titlebar_color background
