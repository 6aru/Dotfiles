
[cursor]

unfocused_hollow = false

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "full"
dynamic_title = true


opacity = 1.0
startup_mode = "Windowed"

[window.dimensions]
columns = 84
lines = 24

[window.padding]
x = 15
y = 15

[colors]
draw_bold_text_with_bright_colors = false

[general]
live_config_reload = true
import = ["/home/baru/.config/sweetconfigs-xorg/alacritty/colors.toml", "/home/baru/.config/sweetconfigs-xorg/alacritty/fonts.toml", "/home/baru/.config/sweetconfigs-xorg/alacritty/mappings.toml"]
